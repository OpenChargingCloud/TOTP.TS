name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs from the Actions tab ("Run workflow"), same as nightly.yml.
  workflow_dispatch:

concurrency:
  # Pull requests: one run per branch, newest wins — a run against a head
  # that has been superseded is answering a question nobody is asking any
  # more.
  #
  # Pushes: one run per commit, and nothing cancels anything. A commit with
  # no verdict is a hole nobody comes back to fill: the next commit contains
  # it, so the code does get tested eventually, but once that run is red
  # there is no longer any way to say which of the two commits did it.
  #
  # Keying the group on the SHA, rather than only turning cancel-in-progress
  # off, is what makes that hold for more than two pushes: a group keeps at
  # most one run *pending*, so a third push discards the second before it
  # ever starts.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # Two operating systems × three Node.js release lines:
    #
    #  * Ubuntu, because that is where this library runs in production.
    #  * Windows, because that is where it is developed — path separators and
    #    line endings in the TypeScript toolchain differ enough to be worth
    #    a leg of their own.
    #  * Node 22, 24 and 26 are the release lines vitest 5 can host (its
    #    engines range is ^22.12.0 || ^24 || >=26), and all three are LTS.
    #    Node 20 is still admitted by this package's own "engines" field, but
    #    the test runner no longer installs there cleanly — the engines-floor
    #    job below covers that claim instead.
    #
    # fail-fast is off on purpose: "red on exactly one leg" is the most
    # valuable signal this matrix produces, so one leg must not cancel the
    # others.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x', '26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # "npm test" runs the TypeScript build first (tsconfig has noEmitOnError)
      # and then the vitest suite, so a compile error and a failing test both
      # surface in this one step. Note what the suite exercises: the sources
      # under src/, transformed by vitest — not the compiled dist/. The build
      # proves dist/ compiles; the engines-floor job below proves it runs.
      - name: Build and test
        run: npm test

  # What "npm run verify" adds to "npm test": the type check over the tests
  # and config files (the build only covers src/) and ESLint. Neither depends
  # on the operating system or the Node release, so one leg is enough — and a
  # job of its own keeps a lint finding from looking like a broken platform.
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # package.json claims "engines": { "node": ">=20.19.0" } — the floor of
  # @noble/hashes, the one runtime dependency — but vitest 5 starts at
  # 22.12.0, so the matrix above can no longer verify that claim. This job
  # does, the way a consumer would meet it: pack the package on a current
  # Node, switch to exactly 20.19.0, install the tarball into an empty
  # project with --engine-strict, and run test/smoke.mjs against what got
  # installed. That one install checks three things at once: the "files"
  # allow-list ships everything the code imports, @noble/hashes resolves,
  # and nothing in the runtime tree refuses Node 20.19.0.
  #
  # The install resolves @noble/hashes from its range, not from the lock
  # file, exactly as a consumer's would — so this job can turn red when a
  # new @noble/hashes raises its own floor, without a commit here. That is
  # the finding it exists for: then either pin the dependency or raise
  # "engines", but never ship a package that no longer installs where it
  # says it does.
  engines-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      # --ignore-scripts keeps prepack, which would run the whole suite
      # again, out of the pack: the build right before it is all it needs.
      - name: Build and pack
        run: |
          npm ci
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'

      - name: Install the tarball on Node 20.19.0 and run the smoke test
        working-directory: ${{ runner.temp }}
        run: |
          node --version
          mkdir consumer
          cd consumer
          npm init -y > /dev/null
          npm install --engine-strict --no-audit --no-fund ../open-charging-cloud-totp-*.tgz
          npm ls --all
          cp "$GITHUB_WORKSPACE/test/smoke.mjs" .
          node smoke.mjs
